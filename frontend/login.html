<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | NxtStepGo</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/style/styles.css">

</head>

<body class="bg-gradient-to-br from-blue-50 to-slate-100 flex items-center justify-center min-h-screen px-4">

<!-- Navigation -->
<nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 px-6 bg-transparent py-6">
    <div class="max-w-7xl mx-auto">
        <a href="/" class="flex items-center gap-3 group text-left brand-logo">
            <div class="brand-icon-wrapper">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-200 brand-icon">
                    <i data-lucide="graduation-cap"></i>
                </div>
            </div>
            <div class="flex flex-col leading-tight">
                <span class="brand-text font-black text-xl text-slate-900">NxtStepGo</span>
                <span class="brand-subtitle text-xs text-blue-600 font-semibold tracking-wide">Career Hub</span>
            </div>
        </a>
    </div>
</nav>

<div class="w-full max-w-md pt-16 pb-8">
    <div class="bg-white p-8 md:p-10 rounded-3xl shadow-2xl border border-slate-100">
        <div class="flex items-center justify-center mb-8">
            <div class="w-12 h-12 bg-blue-600 rounded-xl text-white flex items-center justify-center shadow-md shadow-blue-200">
                <i data-lucide="log-in" class="w-6 h-6"></i>
            </div>
        </div>
        
        <h2 class="text-3xl font-bold mb-2 text-center text-slate-900">Welcome Back</h2>
        <p class="text-center text-slate-500 mb-8 text-sm">Sign in to your account to save bookmarks and personal collections</p>

        <form id="loginForm">
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                <input
                    type="email"
                    placeholder="your@email.com"
                    id="email"
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    required
                />
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <input
                    type="password"
                    placeholder="••••••••"
                    id="password"
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    required
                />
            </div>

            <button
                type="submit"
                id="submit-btn"
                class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-lg hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 hover:shadow-xl hover:-translate-y-0.5"
            >
                Login
            </button>
        </form>

        <div id="error-message" class="mt-4 p-3 rounded-xl bg-red-50 text-red-600 text-sm hidden font-medium text-center"></div>

        <p class="mt-6 text-center text-slate-600 text-sm">
            Don't have an account?
            <a href="/signup.html" class="text-blue-600 font-bold hover:underline">Sign up</a>
        </p>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
            <a href="/departments.html" class="text-slate-500 text-sm hover:text-slate-900 font-semibold inline-flex items-center gap-1">
                Skip to explore branches <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
        </div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const errorDiv = document.getElementById("error-message");
        const submitBtn = document.getElementById("submit-btn");
        errorDiv.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Save user info and session token to localStorage
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('userName', data.user.name);
                if (data.token) {
                    localStorage.setItem('token', data.token);
                }
                
                window.location.href = "/departments.html";
            } else {
                errorDiv.textContent = data.message || "Invalid credentials. Please try again.";
                errorDiv.classList.remove('hidden');
            }
        } catch (error) {
            console.error("Login fetch error:", error);
            errorDiv.textContent = "Unable to connect to server. Please verify your connection.";
            errorDiv.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Login";
        }
    });
</script>

</body>
</html>
